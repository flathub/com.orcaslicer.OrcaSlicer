  # OrcaSlicer application
  - name: OrcaSlicer
    buildsystem: cmake-ninja
    config-opts:
      - -DFLATPAK=ON
      # Builds generate_system_cache, used below to bake the preset caches
      - -DORCA_TOOLS=ON
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_PREFIX_PATH=/app
    make-args:
      - OrcaSlicer
    build-commands:
      - ./scripts/run_gettext.sh
    post-install:
      - | # Desktop integration files
        install -Dm644 -t /app/share/icons/hicolor/scalable/apps/ resources/images/OrcaSlicer.svg
        install -Dm644 scripts/flatpak/${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
        desktop-file-edit --set-key=Exec --set-value="entrypoint %U" /app/share/applications/${FLATPAK_ID}.desktop
        install -Dm755 scripts/flatpak/entrypoint /app/bin
        install -Dm755 scripts/flatpak/umount /app/bin
      - install -Dm644 LICENSE.txt /app/share/licenses/${FLATPAK_ID}/LICENSE.txt
      - | # Install fonts into fontconfig-scanned directory so Pango finds them
        # before initialization (avoids ensure_faces crash from AddPrivateFont)
        install -Dm644 -t /app/share/fonts/OrcaSlicer/ resources/fonts/*.ttf
        fc-cache -f /app/share/fonts/OrcaSlicer/
      # Per-vendor system preset caches (<vendor>.opc), generated against the
      # installed profiles; the preset JSONs they replace are pruned from /app.
      # The build is in-source, so the CMake build tree is the cwd.
      - cmake --build . --target generate_system_cache -j$FLATPAK_BUILDER_N_JOBS
      - ./scripts/build_preset_cache.sh -n -b . /app/share/OrcaSlicer/profiles
    sources:
      - *orcaslicer-git

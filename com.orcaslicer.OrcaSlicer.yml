app-id: com.orcaslicer.OrcaSlicer
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm21
command: entrypoint
rename-icon: OrcaSlicer
build-options:
  append-path: /usr/lib/sdk/llvm21/bin
  prepend-ld-library-path: /usr/lib/sdk/llvm21/lib
  ldflags: -fuse-ld=lld
  env:
    CC: clang
    CXX: clang++
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --device=all
  - --filesystem=home
  - --filesystem=xdg-run/gvfs
  - --filesystem=/run/media
  - --filesystem=/media
  # Network shares (CIFS/NFS) are commonly mounted under /mnt, which the default
  # finish-args don't grant; without it, opening a model from such a share fails
  # with "The file does not contain any geometry data."
  # https://github.com/flathub/com.orcaslicer.OrcaSlicer/issues/2
  - --filesystem=/mnt
  - --filesystem=/run/spnav.sock:ro
  # Allow read-only access to OrcaSlicer's legacy config and cache directories (if they exist) for migration purposes.
  # Must match the single legacy ID the binary migrates from in GUI_App.cpp
  # (io.github.softfever.OrcaSlicer, the widely-used pre-2.3.2 ID).
  - --filesystem=~/.var/app/io.github.softfever.OrcaSlicer:ro
  - --system-talk-name=org.freedesktop.UDisks2
  - --env=SPNAV_SOCKET=/run/spnav.sock

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - "*.a"
  - "*.la"

modules:

  # JPEG codec and GTK video sink (Wayland liveview) for the liveview
  - name: gst-plugins-good
    buildsystem: meson
    config-opts:
      - -Dauto_features=disabled
      - -Djpeg=enabled
      - -Dgtk3=enabled
      - -Ddoc=disabled
      - -Dexamples=disabled
      - -Dtests=disabled
    sources:
      - type: archive
        url: https://gstreamer.freedesktop.org/src/gst-plugins-good/gst-plugins-good-1.22.8.tar.xz
        sha256: e305b9f07f52743ca481da0a4e0c76c35efd60adaf1b0694eb3bb021e2137e39

  - name: kde-extra-cmake-modules
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/KDE/extra-cmake-modules
        tag: v5.249.0
        commit: 008ae77d0cd2a97c346228ab30b99279643e5022
    cleanup:
      - '*'

  - name: libspnav
    sources:
      - type: archive
        url: https://github.com/FreeSpacenav/libspnav/releases/download/v1.2/libspnav-1.2.tar.gz
        sha256: 093747e7e03b232e08ff77f1ad7f48552c06ac5236316a5012db4269951c39db

  # wxWidgets built as a separate module for Flathub (no network at build time)
  # Config-opts mirror deps/wxWidgets/wxWidgets.cmake with FLATPAK=ON, DEP_WX_GTK3=ON
  - name: wxWidgets
    buildsystem: cmake-ninja
    build-options:
      env:
        CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DwxBUILD_PRECOMP=ON
      - -DwxBUILD_TOOLKIT=gtk3
      - -DCMAKE_DEBUG_POSTFIX:STRING=d
      - -DwxBUILD_DEBUG_LEVEL=0
      - -DwxBUILD_SAMPLES=OFF
      - -DwxBUILD_SHARED=ON
      - -DBUILD_SHARED_LIBS=ON
      - -DwxUSE_MEDIACTRL=ON
      - -DwxUSE_DETECT_SM=OFF
      - -DwxUSE_PRIVATE_FONTS=ON
      - -DwxUSE_OPENGL=ON
      - -DwxUSE_GLCANVAS_EGL=ON
      - -DwxUSE_WEBREQUEST=ON
      - -DwxUSE_WEBVIEW=ON
      - -DwxUSE_WEBVIEW_EDGE=OFF
      - -DwxUSE_WEBVIEW_IE=OFF
      - -DwxUSE_REGEX=builtin
      - -DwxUSE_LIBSDL=OFF
      - -DwxUSE_XTEST=OFF
      - -DwxUSE_STC=OFF
      - -DwxUSE_AUI=ON
      - -DwxUSE_LIBPNG=sys
      - -DwxUSE_ZLIB=sys
      - -DwxUSE_LIBJPEG=sys
      - -DwxUSE_LIBTIFF=OFF
      # sys, not builtin (unlike the static deps build): wxWidgets installs the
      # builtin libwxwebp*.so only for static builds, so a shared build leaves
      # them missing at runtime. The GNOME runtime provides libwebp.
      - -DwxUSE_LIBWEBP=sys
      - -DwxUSE_EXPAT=sys
      - -DwxUSE_NANOSVG=OFF
    sources:
      # Use git instead of archive: wxWidgets 3.3 relies on multiple git
      # submodules (PCRE2, etc.) that are not included in GitHub tarballs.
      # v3.3.2 branch @ b44c39c (Wayland seat release fix). No tag exists for
      # it, and Flathub's linter rejects `branch:`, so pin by commit only.
      - type: git
        url: https://github.com/OrcaSlicer/Orca-deps-wxWidgets.git
        commit: b44c39c100975a0ac0e46f937aa3f3eae5e18631

  # OrcaSlicer dependency libraries (ExternalProject-based, installed to /app)
  - name: OrcaSlicer-deps
    buildsystem: cmake-ninja
    subdir: deps
    no-make-install: true
    config-opts:
      - -DFLATPAK=ON
      - -DDEP_DOWNLOAD_DIR=/run/build/OrcaSlicer-deps/external-packages
      - -DDESTDIR=/app
    post-install:
      # uv runs from the app resources at runtime, and the OrcaSlicer module's
      # CMake picks it up there instead of downloading it (the build sandbox has
      # no network), so it has to be installed before that module configures.
      # The cwd is deps/; the uv archive is extracted beside it.
      - install -Dm755 ../uv/uv /app/share/OrcaSlicer/tools/uv/uv
    cleanup:
      # CPython headers: not needed at runtime (no compiler in the runtime
      # sandbox). They sit under /app/libpython, which the top-level /include
      # pattern does not reach.
      - /libpython/include
    sources:
      # OrcaSlicer source tree (provides deps/ cmake files, patches, bundled sources)
      # Pinned to release/v2.5.0 @ 325fe34, the 2.5.0 release, which marks
      # 2.5.0 as stable in the metainfo.
      - &orcaslicer-git
        type: git
        url: https://github.com/OrcaSlicer/OrcaSlicer.git
        commit: 325fe348a63d846cf737e9394a583a60711efc31

